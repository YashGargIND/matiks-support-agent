[project]
name = "matiks-support-agent"
version = "0.1.0"
description = "Evidence-backed, dry-run support workbench for Matiks"
requires-python = ">=3.11,<3.15"
dependencies = [
  "openai-agents==0.23.1",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "streamlit>=1.50,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = ["pymongo>=4.14,<5", "google-cloud-logging>=3.12,<4"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1"]

[project.scripts]
matiks-support = "support.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
